<html>
<body>
<script type="text/javascript">
	var str="javacsript is very easy";
	document.write(str.charAt(2));
	document.writeln("<br>");
	
	document.writeln(str.substring(5,10));
	document.writeln("<br>");

	var s2=str.trim();
	document.writeln(s2);
	document.writeln("<br>");
	
	var s2=str.slice(15,20);
	document.writeln(s2);
	document.writeln("<br>");

	var n="hello world";
	document.write(n);
	document.writeln("<br>");

	document.write(n.replace("world","student"));
</script>
</body>
</html>
