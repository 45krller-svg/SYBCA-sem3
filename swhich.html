<html>
<body>
<script type="text/javascript">
	var grade='c';
	document.write("entering switch block<br/>");
	switch(grade)
	{
	case 'a':document.write("entering <br/>");
	case 'b':document.write("switch block<br/>");
	case 'c':document.write("entering block<br/>");
	case 'd':document.write("block<br/>");
	case 'f':document.write("all block<br/>");
	default:document.write("don't switch block<br/>"); 	
	}
	document.write("exiting switch block");
</script>
</body>
</html>
